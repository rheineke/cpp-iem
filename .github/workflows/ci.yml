name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Native arm64 runner, matching the Docker build's linux/arm64 target
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test in Debian trixie
        run: docker build --platform linux/arm64 -f docker/debian-trixie.Dockerfile -t cpp-iem:trixie .
