# Install: pre-commit install. Run on everything: pre-commit run --all-files
# Vendored code (googletest submodule, amalgamated jsoncpp) is left as upstream wrote it.
exclude: ^(deps/|src/json/|src/jsoncpp\.cpp$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.patch$  # context lines in patches end in spaces
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++]
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
      - id: cmake-lint
